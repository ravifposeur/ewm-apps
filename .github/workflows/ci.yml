name: Contract Conformance CI

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]

jobs:
  contract-conformance:
    name: Contract Conformance & Integration Tests
    runs-on: ubuntu-latest

    # 1. Start DB Container
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ewm_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Service Dependencies
        run: cd service && npm install

      # 2. Apply Database Schema
      - name: Apply Database Schema
        run: |
          if [ -f db/schema.sql ]; then
            echo "Applying db/schema.sql..."
            PGPASSWORD=postgrespassword psql -h localhost -U postgres -d ewm_db -f db/schema.sql
          elif [ -f service/db/schema.sql ]; then
            echo "Applying service/db/schema.sql..."
            PGPASSWORD=postgrespassword psql -h localhost -U postgres -d ewm_db -f service/db/schema.sql
          else
            echo "Warning: db/schema.sql not found yet. Skipping schema initialization."
          fi
      - name: Apply Database Seed
        run: |
          if [ -f service/db/seed.sql ]; then
            echo "Applying service/db/seed.sql..."
            PGPASSWORD=postgrespassword psql -h localhost -U postgres -d ewm_db -f service/db/seed.sql
          elif [ -f db/seed.sql ]; then
            echo "Applying db/seed.sql..."
            PGPASSWORD=postgrespassword psql -h localhost -U postgres -d ewm_db -f db/seed.sql
          else
            echo "Warning: seed.sql not found"
          fi
      # 3. Start JWKS test server
      #
      # URUTAN PENTING: JWKS harus hidup SEBELUM service start.
      #
      # Service memakai createRemoteJWKSet yang melakukan CACHE. Kalau JWKS
      # belum melayani saat token pertama tiba, service mengunduh yang tidak
      # berguna lalu mengunci kunci itu selamanya — setiap token berikutnya
      # ditolak dengan ERR_JWKS_NO_MATCHING_KEY.
      #
      # Server ini juga yang menandatangani token test lewat POST /sign, jadi
      # hanya ada SATU keypair untuk service dan test. Kalau test menandatangani
      # sendiri, kuncinya berbeda dan verifikasi selalu gagal.
      - name: Start JWKS Test Server
        env:
          JWKS_PORT: 9999
        run: |
          node tests/helpers/jwks-server.js &
          timeout 20s bash -c 'until curl -sf http://127.0.0.1:9999/jwks.json > /dev/null; do sleep 0.5; done' \
            || echo "JWKS test server did not become ready within 20s (Proceeding)"

      # 4. Start Express Service & 5. Wait for Healthcheck
      - name: Start Express Service & Wait for Health
        env:
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ewm_db
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ewm_db
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          NODE_ENV: test
          # JWKS lokal yang dijalankan pada langkah sebelumnya. Service
          # memverifikasi signature token test lewat endpoint ini.
          OIDC_ISSUER: https://test.local/
          OIDC_AUDIENCE: eventwise-api
          OIDC_JWKS_URI: http://127.0.0.1:9999/jwks.json
        run: |
          if [ -f service/src/app.js ]; then
            node service/src/app.js &
          elif [ -f src/app.js ]; then
            node src/app.js &
          else
            echo "No service entry point found yet. Running against mock or existing runner."
          fi

          # Healthcheck wait loop (Timeout 30s)
          echo "Waiting for service at http://localhost:3000/health..."
          timeout 30s bash -c 'until curl -sf http://localhost:3000/health; do sleep 1; done' || echo "Service not responding to /health within 30s (Proceeding to tests)"

      # 6. Run Contract Tests
      - name: Run Contract Tests
        env:
          BASE_URL: http://localhost:3000
          # Test menandatangani token lewat /sign milik JWKS server yang sama,
          # supaya kunci token sama dengan kunci yang diunduh service.
          OIDC_JWKS_URI: http://127.0.0.1:9999/jwks.json
          OIDC_ISSUER: https://test.local/
          OIDC_AUDIENCE: eventwise-api
        run: npm run test:contract

      # 7. Run Test Helper Suite (token fixture + JWKS server)
      - name: Run Helper Tests
        env:
          OIDC_ISSUER: https://test.local/
          OIDC_AUDIENCE: eventwise-api
        run: npm run test:helpers
