# Authorization Server — Keycloak (dev only)
# SDD source of truth: openapi.yaml `components.securitySchemes.oauth2.scopes`
# + docs/decisions/0003-autentikasi.md (scope vocabulary EWM).
# File ini milik Integration Owner dan terisolasi di infra/ agar tidak
# menyenggol pekerjaan Service Owner (service/**) / Contract Owner (openapi.yaml).
#
# Usage:
#   KC_ADMIN_PASSWORD=... docker compose -f infra/docker-compose.auth.yml up -d
#   curl -s http://localhost:8080/realms/eventwise/.well-known/openid-configuration | jq '{issuer, jwks_uri}'

services:
  auth:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in env, never commit it}
    ports:
      - "8080:8080"
    volumes:
      # Opsional: persist realm export antar restart (di-gitignore-kan).
      - keycloak-data:/opt/keycloak/data
      # Realm dev (scope, client, user) diimpor otomatis saat start bila belum ada.
      # Suffix :z wajib di host ber-SELinux (Fedora) agar file terbaca user container.
      - ./keycloak/eventwise-realm.json:/opt/keycloak/data/import/eventwise-realm.json:ro,z
    healthcheck:
      # Cek halaman depan Keycloak. Disengaja TIDAK memakai
      # /health/ready: endpoint itu 404 di image ini (smallrye-health tidak aktif
      # secara default). Header Host WAJIB dikirim: tanpanya Keycloak 26 menjawab
      # 500 (strict hostname handling) — terbukti saat debug 2026-09-23.
      # Sehat = 200 ATAU 302 (halaman depan me-redirect ke console admin).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET / HTTP/1.1\\r\\nHost: localhost:8080\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -c 15 <&3 | grep -qE ' 200| 302'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  keycloak-data:
