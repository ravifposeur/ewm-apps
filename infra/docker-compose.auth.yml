# Authorization Server — Keycloak (dev only)
# SDD source of truth: openapi.yaml `components.securitySchemes.oauth2.scopes`
# + docs/decisions/0003-autentikasi.md (scope vocabulary EWM).
# File ini milik Integration Owner dan terisolasi di infra/ agar tidak
# menyenggol pekerjaan Service Owner (service/**) / Contract Owner (openapi.yaml).
#
# Usage:
#   KC_ADMIN_PASSWORD=... docker compose -f infra/docker-compose.auth.yml up -d
#   curl -s http://localhost:8080/realms/eventwise/.well-known/openid-configuration | jq '{issuer, jwks_uri}'

services:
  auth:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in env, never commit it}
    ports:
      - "8080:8080"
    volumes:
      # Opsional: persist realm export antar restart (di-gitignore-kan).
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r' >&3 && head -c 12 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  keycloak-data:
