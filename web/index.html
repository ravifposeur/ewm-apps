<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventWise</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <header class="topbar">
      <a href="#/" class="brand" data-route="/">EventWise</a>
      <div class="topbar-right">
        <div id="user-info" class="user-info hidden">
          <span id="user-name" class="user-name">—</span>
          <span id="user-role" class="user-role">—</span>
          <button id="btn-logout" class="btn btn-ghost btn-sm">Sign out</button>
        </div>
      </div>
    </header>

    <!-- Alert banner -->
    <div id="alert-banner" class="alert hidden" role="alert">
      <div class="alert-body">
        <strong id="alert-title">Notice</strong>
        <span id="alert-detail"></span>
      </div>
      <button id="alert-close" class="alert-close" aria-label="Dismiss">&times;</button>
    </div>

    <!-- Login view (unauthenticated) -->
    <!-- Login view (unauthenticated) -->
    <main id="view-login" class="auth-view">
      <div class="auth-card">
        <h1>Sign in to EventWise</h1>
        <p class="auth-subtitle">Enter your credentials to continue.</p>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" id="login-username" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="login-password" autocomplete="current-password" required>
          </div>

          <div id="login-error" class="form-error hidden"></div>

          <button type="submit" class="btn btn-primary" id="login-submit" style="width:100%;margin-top:8px">Sign in</button>
        </form>

        <div class="auth-footer">
          <details>
            <summary style="cursor:pointer;color:var(--text-muted)">Demo credentials</summary>
            <div style="margin-top:8px;line-height:1.8">
              <div><strong>organizer-a</strong> / organizer123</div>
              <div><strong>admin-a</strong> / admin123</div>
              <div><strong>crew-a</strong> / crew123</div>
            </div>
          </details>
        </div>
      </div>
    </main>

    <!-- App shell (authenticated) -->
    <div id="view-app" class="shell hidden">
      <aside class="sidebar">
        <nav class="nav">
          <span class="nav-section">Workspace</span>
          <a href="#/events" class="nav-item" data-route="/events">Events</a>
          <a href="#/collections" class="nav-item" data-route="/collections">Submit Collection</a>
          <a href="#/health" class="nav-item" data-route="/health">System Health</a>
        </nav>

        <div class="sidebar-footer">
          <span class="nav-section">Session</span>
          <div class="session-info">
            <div class="session-row">
              <span>Subject</span>
              <span id="session-sub" class="session-value">—</span>
            </div>
            <div class="session-row">
              <span>Scopes</span>
              <span id="session-scopes" class="session-value">—</span>
            </div>
          </div>
        </div>
      </aside>

      <main class="content" id="screen-container"></main>
    </div>
  </div>

  <script>
    // Production config injection
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    window.ENV = {
      VITE_API_BASE_URL: isLocal
        ? 'http://localhost:3000'
        : 'https://backend-production-fbc2.up.railway.app',
      VITE_JWKS_SIGN_URL: isLocal
        ? 'http://127.0.0.1:9999/sign'
        : 'https://jwks-production-e785.up.railway.app/sign',
    };
  </script>
  <script src="app.js"></script>
</body>
</html>
